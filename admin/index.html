<script>
window.__sbReady=new Promise(function(res,rej){var urls=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js','https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.45.4/supabase.min.js'];var i=0;function next(){if(i>=urls.length){rej(new Error('cdn'));return}var s=document.createElement('script');s.src=urls[i++];s.onload=function(){window.supabase?res():next()};s.onerror=next;document.head.appendChild(s)}next()});

<style>
:root{--bg:#eef3ef;--surf:#fff;--ink:#12332b;--mut:#5d7a70;--acc:#ffc93c;--red:#e4572e;--ok:#2e9e6b;--line:#dbe5de;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a16;--surf:#172620;--ink:#e8f2ec;--mut:#8fb0a3;--line:#27403a}}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:960px;margin:0 auto;padding-bottom:40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select{font:inherit;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
header{background:var(--ink);color:#fff;padding:16px;border-radius:0 0 24px 24px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:19px}header button{color:#b9d3c8;font-size:14px}
.tabs{display:flex;gap:8px;padding:14px 16px 4px;overflow-x:auto}
.tab{flex:none;padding:9px 18px;border-radius:99px;background:var(--surf);border:1px solid var(--line);font-weight:500}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:12px 16px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.1}.kpi span{font-size:12px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut)}
.bars i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}.row .e{font-size:28px;width:40px;text-align:center}.row .t{flex:1;min-width:0}
.u{color:var(--mut);font-size:13px}
.old{text-decoration:line-through;color:var(--mut);font-size:12px;margin-inline-start:6px}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;color:#fff;background:var(--ok)}.pill.off{background:var(--mut)}.pill.red{background:var(--red)}
.btn{padding:11px 16px;border-radius:12px;background:var(--acc);color:#12332b;font-weight:800}
.btn.sec{background:var(--bg);color:var(--ink);font-weight:500;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tools input{flex:2;min-width:160px}.tools select{flex:1;min-width:120px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--surf);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.hide{display:none!important}
.login{max-width:380px;margin:0 auto;padding:60px 20px}.login input{margin-bottom:10px}
.empty{color:var(--mut);text-align:center;padding:24px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;z-index:9;max-width:92%;text-align:center}
</style>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0B5D44"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="stylesheet" href="../theme.css"><style id="map-css">
.lm-wrap{display:grid;gap:12px}
#lmMap{height:56vh;min-height:320px;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 24px rgba(18,51,43,.08)}
.lm-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.lm-bar b{color:var(--ink)}
.lm-side{display:grid;gap:10px}
.lm-card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px}
.lm-card .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.lm-card .hd b{font-size:15px;color:var(--ink)}
.lm-tag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px;background:#e6f5ec;color:#1f7a50}
.lm-tag.stale{background:#fff1e9;color:#b5461f}
.lm-ord{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:13px}
.lm-ord .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:var(--ink)}
.lm-ord .u{color:var(--mut);margin-top:3px;line-height:1.5}
.lm-ord ul{margin:6px 0 0;padding:0;list-style:none}
.lm-ord li{padding:2px 0;color:var(--ink)}
.lm-ord li.na{color:var(--mut);text-decoration:line-through}
.lm-ord li.na::after{content:" (غير متوفر)";color:var(--red);text-decoration:none;font-size:11px}
.lm-pin{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#0B5D44;color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.25);border:3px solid #fff}
.lm-pin.stale{background:#b5461f}
.lm-store{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid #E8A000;box-shadow:0 4px 12px rgba(0,0,0,.25);padding:3px;box-sizing:border-box;display:block}
.lm-pin.store{background:#E8A000;font-size:16px;width:34px;height:34px}
.lm-pin.home{background:#fff;color:#0B5D44;border:2px solid #0B5D44;width:30px;height:30px;font-size:14px}
.lm-empty{background:var(--surf);border:1px dashed var(--line);border-radius:16px;padding:18px;text-align:center;color:var(--mut)}
</style>
</head>
<body data-app="admin">

<section id="login" class="login hide">
  <img class="logo-lg" src="logo.svg" alt="جبلاوى"><h1 class="wm">جبلاوى</h1><div class="wm-en">JABALAWY</div><h2 style="padding:0;font-size:18px;margin-bottom:4px">لوحة الإدارة</h2>
  <p class="u" style="margin-bottom:18px">دخول المدير فقط.</p>
  <input id="em" type="text" placeholder="رقم الجوال أو البريد الإلكتروني" autocomplete="username" dir="ltr" style="text-align:right">
  <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button class="btn" style="width:100%" onclick="login()">تسجيل الدخول</button>
</section>

<div id="app" class="hide">
  <header><span class="bl"><img class="mk" src="mark.svg" alt=""><span><b class="bn">جبلاوى</b><small class="en">JABALAWY</small><h1>الإدارة</h1></span></span><button onclick="logout()">خروج</button></header>
  <nav class="tabs">
    <button class="tab" data-t="sum" aria-pressed="true">الملخص</button>
    <button class="tab" data-t="map" aria-pressed="false">الخريطة الحية</button>
    <button class="tab" data-t="prod" aria-pressed="false">المنتجات</button>
    <button class="tab" data-t="home" aria-pressed="false">الواجهة</button>
    <button class="tab" data-t="stores" aria-pressed="false">المستودعات</button>
    <button class="tab" data-t="capps" aria-pressed="false">طلبات المناديب</button>
    <button class="tab" data-t="promo" aria-pressed="false">الأكواد</button>
    <button class="tab" data-t="wal" aria-pressed="false">المحفظة</button>
    <button class="tab" data-t="team" aria-pressed="false">الفريق</button>
    <button class="tab" data-t="set" aria-pressed="false">الإعدادات</button>
  </nav>
  <main id="main"></main>
</div>
<div id="modal" class="modal hide"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="hide" role="status"></div>

<script>
/* ===== الإعدادات: نفس بيانات مشروع Supabase المستخدمة في بقية التطبيقات ===== */
const SB_URL='https://fektjanhxtmhzaiptdtt.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla3RqYW5oeHRtaHphaXB0ZHR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExODQwMTAsImV4cCI6MjEwNjc2MDAxMH0.oRkTzZ03st-NTfZ3zioVjjC1Y_DPOKLb57n8pVfNYZA';
/* ======================================================================= */

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n).toFixed(2).replace(/\.00$/,'')+' ج.م';
const ROLE={customer:'عميل',courier:'مندوب',staff:'موظف مستودع',admin:'مدير'};
let sb,cur='sum',cats=[],prods=[],stores=[],team=[],f={q:'',cat:'',tq:''};

function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.add('hide'),3000)}
const modal=h=>{$('sheet').innerHTML=h;$('modal').classList.remove('hide')};
const shown=e=>String(e||'').replace('@phone.salla-sareea.app','');
const closeM=()=>$('modal').classList.add('hide');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));show()});

/* ---------- الدخول ---------- */
const PHONE_DOMAIN='phone.salla-sareea.app';
function normPhone(s){s=String(s||'').trim();if(s.includes('@'))return null;const d=s.replace(/\D/g,'').replace(/^(0020|20)/,'0');return /^01[0125]\d{8}$/.test(d)?d:null}
function loginId(v){v=String(v||'').trim();const p=normPhone(v);return p?p+'@'+PHONE_DOMAIN:v}
async function login(){const {error}=await sb.auth.signInWithPassword({email:loginId($('em').value),password:$('pw').value});
 if(error)return toast('تعذر الدخول: تحقق من رقم الجوال أو البريد وكلمة المرور');boot()}
async function logout(){await sb.auth.signOut();$('app').classList.add('hide');$('login').classList.remove('hide')}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){$('login').classList.remove('hide');return}
 const p=await sb.from('profiles').select('role').eq('id',session.user.id).single();
 if(p.error||p.data.role!=='admin'){await sb.auth.signOut();$('login').classList.remove('hide');return toast('هذا الحساب ليس حساب مدير')}
 $('login').classList.add('hide');$('app').classList.remove('hide');
 await loadCatalog();show()}
async function loadCatalog(){
 const [c,p,s]=await Promise.all([sb.from('categories').select('*').order('sort_order'),sb.from('products').select('*').order('id'),sb.from('stores').select('*').order('name')]);
 if(c.error||p.error||s.error)return toast('تعذر تحميل البيانات');
 cats=c.data;prods=p.data;stores=s.data}
function show(){({map:vMap,sum:vSum,prod:vProd,home:vHome,stores:vStores,capps:vCapps,promo:vPromo,wal:vWal,team:vTeam,set:vSet})[cur]()}


/* ---------- الخريطة الحية ---------- */
let LM=null,LMLayer=null,LMTimer=null,LMData=null;
function loadLeafletA(){return window.L?Promise.resolve():new Promise((ok,no)=>{
 const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);
 const sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';sc.onload=ok;sc.onerror=()=>no(new Error('map'));document.head.appendChild(sc)})}
const minsAgo=t=>Math.floor((Date.now()-new Date(t))/60000);
const STATUS_AR={picking:'قيد التجهيز',ready:'جاهز للاستلام',picked_up:'مع المندوب'};
async function vMap(){
 clearInterval(LMTimer);
 $('main').innerHTML=`<div class="lm-wrap">
  <div class="lm-bar"><span>المناديب المتصلون الآن: <b id="lmCnt">...</b></span><span id="lmUp" class="u"></span></div>
  <div id="lmMap"></div>
  <div class="lm-side" id="lmSide"><div class="lm-empty">جاري تحميل البيانات...</div></div></div>`;
 try{await loadLeafletA()}catch(e){return toast('تعذر تحميل الخريطة. تحقق من الإنترنت')}
 if(LM){LM.remove();LM=null}
 LM=L.map('lmMap',{zoomControl:true}).setView([30.05,31.25],12);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(LM);
 LMLayer=L.layerGroup().addTo(LM);
 await refreshMap(true);
 LMTimer=setInterval(()=>{if(cur==='map')refreshMap(false)},10000);
}
function pinIcon(html,cls){return L.divIcon({className:'',html:`<div class="lm-pin ${cls||''}">${html}</div>`,iconSize:[38,38],iconAnchor:[19,19]})}
async function refreshMap(fit){
 if(!LM||cur!=='map')return;
 const r=await sb.rpc('admin_live_map');
 if(r.error)return toast(r.error.message||'تعذر تحميل الخريطة');
 LMData=r.data||{stores:[],couriers:[]};
 LMLayer.clearLayers();
 const pts=[];
 (LMData.stores||[]).forEach(s=>{if(s.lat==null)return;const m=[+s.lat,+s.lng];pts.push(m);
  L.marker(m,{icon:L.divIcon({className:'',html:'<img class="lm-store" src="store-marker.png" alt="">',iconSize:[42,42],iconAnchor:[21,21]})}).bindTooltip(esc(s.name)).addTo(LMLayer)});
 let active=0;
 (LMData.couriers||[]).forEach(c=>{
  const stale=minsAgo(c.updated_at)>2;
  if(c.lat!=null){
   const cm=[+c.lat,+c.lng];pts.push(cm);active++;
   L.marker(cm,{icon:pinIcon('🛵',stale?'stale':'')}).bindTooltip(esc(c.name)+(stale?' (لم يتحدث منذ '+minsAgo(c.updated_at)+' د)':'')).on('click',()=>focusCourier(c.id)).addTo(LMLayer);
  }
  (c.orders||[]).forEach(o=>{
   if(o.address_lat==null)return;
   const hm=[+o.address_lat,+o.address_lng];pts.push(hm);
   L.marker(hm,{icon:pinIcon('🏠','home')}).bindTooltip('طلب #'+o.id+' · '+esc(o.customer_name)).on('click',()=>focusCourier(c.id)).addTo(LMLayer);
   if(c.lat!=null)L.polyline([[+c.lat,+c.lng],hm],{color:'#0B5D44',weight:3,dashArray:'6 8',opacity:.7}).addTo(LMLayer);
  });
 });
 $('lmCnt').textContent=active;
 $('lmUp').textContent='تحديث تلقائي كل 10 ثوانٍ · '+new Date().toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
 drawCourierList();
 if(fit&&pts.length)LM.fitBounds(pts,{padding:[40,40],maxZoom:15});
}
function drawCourierList(){
 const box=$('lmSide');if(!box||!LMData)return;
 const cs=LMData.couriers||[];
 if(!cs.length){box.innerHTML='<div class="lm-empty">لا يوجد مناديب متصلون الآن</div>';return}
 box.innerHTML=cs.map(c=>{
  const stale=minsAgo(c.updated_at)>2;
  const orders=(c.orders||[]);
  return `<div class="lm-card"><div class="hd" onclick="focusCourier('${c.id}')">
    <b>🛵 ${esc(c.name)}${c.vehicle_plate?' · '+esc(c.vehicle_plate):''}</b>
    <span class="lm-tag ${stale?'stale':''}">${stale?'موقع متأخر':'متصل'} · ${orders.length} طلب</span></div>
   ${orders.length?orders.map(o=>`<div class="lm-ord">
     <div class="t"><span>طلب #${o.id} · ${esc(o.customer_name)}</span><span>${fmt(o.total)}</span></div>
     <div class="u">${STATUS_AR[o.status]||esc(o.status)} · ${o.payment==='cash'?'كاش عند الاستلام':'مدفوع مسبقاً'} · ${esc(o.store_name||'')}</div>
     <div class="u">📍 ${esc(o.address_line||'')}</div>
     <ul>${(o.items||[]).map(i=>`<li class="${i.unavailable?'na':''}">${esc(i.name)} × ${i.qty}</li>`).join('')}</ul>
   </div>`).join(''):'<div class="u" style="margin-top:8px">لا توجد طلبات مع هذا المندوب حالياً</div>'}
  </div>`}).join('');
}
function focusCourier(id){
 const c=(LMData&&LMData.couriers||[]).find(x=>x.id===id);if(!c||c.lat==null||!LM)return;
 LM.setView([+c.lat,+c.lng],15);
}

/* ---------- الملخص ---------- */
async function vSum(){
 $('main').innerHTML='<div class="empty">جاري التحميل...</div>';
 const d0=new Date();d0.setHours(0,0,0,0);const from=new Date(d0);from.setDate(from.getDate()-6);
 const r=await sb.from('orders').select('id,status,total,created_at,order_items(name,qty)').gte('created_at',from.toISOString()).limit(1000);
 if(r.error)return toast('تعذر تحميل الطلبات');
 const key=d=>new Date(d).toLocaleDateString('en-CA'),tk=key(d0);
 const ok=r.data.filter(o=>o.status!=='cancelled'&&o.status!=='awaiting_payment'),td=ok.filter(o=>key(o.created_at)===tk);
 const rev=td.reduce((s,o)=>s+ +o.total,0),canc=r.data.filter(o=>o.status==='cancelled'&&key(o.created_at)===tk).length;
 const days=[...Array(7)].map((_,i)=>{const d=new Date(from);d.setDate(d.getDate()+i);const k=key(d);
  return {l:d.toLocaleDateString('ar-EG',{weekday:'short'}),v:ok.filter(o=>key(o.created_at)===k).reduce((s,o)=>s+ +o.total,0)}});
 const mx=Math.max(1,...days.map(x=>x.v));
 const top={};ok.forEach(o=>o.order_items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));
 const T=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
 $('main').innerHTML=`<div class="kpis">
  <div class="kpi"><b>${td.length}</b><span>طلبات اليوم</span></div>
  <div class="kpi"><b>${fmt(rev)}</b><span>مبيعات اليوم</span></div>
  <div class="kpi"><b>${td.length?fmt(rev/td.length):'-'}</b><span>متوسط الطلب</span></div>
  <div class="kpi"><b>${canc}</b><span>ملغاة اليوم</span></div></div>
 <div class="card"><b>مبيعات آخر 7 أيام</b><div class="bars">${days.map(x=>`<div><span>${x.v?Math.round(x.v):''}</span><i style="height:${x.v/mx*80}%"></i><span>${x.l}</span></div>`).join('')}</div></div>
 <div class="card"><b>الأكثر مبيعاً (7 أيام)</b>${T.length?T.map(([n,q])=>`<div class="row"><div class="t">${esc(n)}</div><b>${q}</b></div>`).join(''):'<div class="empty">لا توجد مبيعات بعد</div>'}</div>`}

/* ---------- المنتجات ---------- */
function vProd(){
 $('main').innerHTML=`<div class="tools"><input id="pq" placeholder="ابحث عن منتج" value="${esc(f.q)}" aria-label="بحث">
  <select id="pc" aria-label="القسم"><option value="">كل الأقسام</option>${cats.map(c=>`<option value="${c.id}" ${f.cat==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
  <button class="btn" onclick="pForm()">+ منتج جديد</button><button class="btn sec" onclick="bulkForm()">خصم جماعي</button></div><div class="card" id="plist"></div>`;
 $('pq').oninput=e=>{f.q=e.target.value;pList()};$('pc').onchange=e=>{f.cat=e.target.value;pList()};pList()}
function pList(){
 const L=prods.filter(p=>p.name.includes(f.q.trim())&&(!f.cat||p.category_id==f.cat));
 $('plist').innerHTML=L.length?L.map(p=>`<div class="row">${p.image_url?`<img class="thumb" src="${esc(p.image_url)}" alt="" loading="lazy">`:`<div class="e">${esc(p.emoji||'🛒')}</div>`}

/* تصغير الصورة في المتصفح ثم رفعها إلى مخزن الصور */
function shrink(file,max=800){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');
  c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  c.toBlob(b=>b?res(b):rej(new Error('تعذر تجهيز الصورة')),'image/jpeg',.82)};
 im.onerror=()=>rej(new Error('ملف الصورة غير صالح'));im.src=u})}
async function imgPick(e){
 const file=e.target.files[0];if(!file)return;
 if(!/^image\//.test(file.type))return toast('اختر ملف صورة');
 $('fmsg').textContent='جاري الرفع...';$('sv').disabled=true;
 try{
  const blob=await shrink(file),path='p'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
  const up=await sb.storage.from('products').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
  if(up.error)throw up.error;
  imgUrl=sb.storage.from('products').getPublicUrl(path).data.publicUrl;
  $('fprev').innerHTML='<img src="'+esc(imgUrl)+'" alt="">';$('frm').hidden=false;$('fmsg').textContent='تم رفع الصورة. اضغط حفظ لتثبيتها.';
 }catch(err){$('fmsg').textContent='تعذر رفع الصورة: '+(err.message||'')}
 $('sv').disabled=false;e.target.value=''}

 const sign=async p=>{const r=await sb.storage.from('courier-docs').createSignedUrl(p,900);return r.data?r.data.signedUrl:''};
 const [u1,u2,u3]=await Promise.all([sign(a.id_card_path),sign(a.license_path),sign(a.photo_path)]);
 const img=(u,t)=>`<div style="flex:1;min-width:0"><small class="u">${t}</small><a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${t}" style="width:100%;border-radius:10px;background:#fff;margin-top:4px"></a></div>`;
 modal(`<h2 style="margin-bottom:4px">${esc(a.full_name)}</h2>
 <p class="u" dir="ltr" style="text-align:start">${esc(a.phone)} · ${esc(a.email)}</p>
 <p class="u">الرقم القومي: <b dir="ltr">${esc(a.national_id)}</b></p>
 <p class="u">${VT2[a.vehicle_type]||''} · رقم المركبة: <b>${esc(a.vehicle_plate)}</b></p>
 <div style="display:flex;gap:8px;margin:12px 0">${img(u1,'البطاقة')}${img(u2,'الرخصة')}${img(u3,'الصورة')}</div>
 ${a.status==='pending'?`<div class="two"><button class="btn" id="apok" onclick="appApprove(${a.id})">موافقة وإنشاء الحساب</button><button class="btn sec" style="color:var(--red)" onclick="appReject(${a.id})">رفض</button></div>`
   :`<p><span class="pill ${a.status==='approved'?'':'off'}">${APP_STATUS[a.status]}</span>${a.reject_reason?' · '+esc(a.reject_reason):''}</p>`}`)}
function appPw(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=new Uint8Array(10);crypto.getRandomValues(r);return Array.from(r,b=>c[b%c.length]).join('')}
async function appApprove(id){
 const a=courApps.find(x=>x.id===id);if(!a)return;
 $('apok').disabled=true;
 try{
  const pw=appPw();
  const s=await sb.functions.invoke('phone-signup',{body:{phone:a.phone,password:pw,full_name:a.full_name}});
  if(s.error){let j=null;try{j=await s.error.context.json()}catch(e){}
   throw new Error(j&&j.error==='exists'?'هذا الرقم لديه حساب بالفعل':'تعذر إنشاء الحساب')}
  const email=a.phone+'@phone.salla-sareea.app';
  const u=await sb.rpc('admin_users');if(u.error)throw u.error;
  const user=(u.data||[]).find(x=>x.email===email);if(!user)throw new Error('الحساب غير موجود بعد، أعد المحاولة');
  const role=await sb.rpc('admin_set_role',{p_user:user.id,p_role:'courier',p_store:null});if(role.error)throw role.error;
  // نسخ صورة المندوب إلى التخزين العام لتظهر للعميل
  const dl=await sb.storage.from('courier-docs').download(a.photo_path);if(dl.error)throw dl.error;
  const path='cr'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
  const up=await sb.storage.from('products').upload(path,dl.data,{contentType:'image/jpeg',cacheControl:'31536000'});if(up.error)throw up.error;
  const avatar=sb.storage.from('products').getPublicUrl(path).data.publicUrl;
  const info=await sb.rpc('admin_set_courier_info',{p_id:user.id,p_avatar:avatar,p_vehicle_type:a.vehicle_type,p_plate:a.vehicle_plate});if(info.error)throw info.error;
  const st=await sb.from('courier_applications').update({status:'approved',reviewed_at:new Date().toISOString()}).eq('id',id);if(st.error)throw st.error;
  const link=location.origin+'/courier/';
  const txt=`مرحباً ${a.full_name}، تم قبول طلبك كمندوب في جبلاوى.\nرابط التطبيق: ${link}\nرقم الجوال: ${a.phone}\nكلمة المرور: ${pw}`;
  modal(`<h2 style="margin-bottom:6px">تم إنشاء حساب المندوب ✅</h2>
   <p class="u" style="margin-bottom:8px">أرسل هذه البيانات للمندوب. كلمة المرور لا تُعرض مرة أخرى.</p>
   <textarea readonly id="cred" style="width:100%;min-height:130px;direction:rtl" dir="rtl">${esc(txt)}</textarea>
   <div class="two" style="margin-top:12px"><button class="btn" onclick="navigator.clipboard.writeText($('cred').value).then(()=>toast('تم النسخ'),()=>{$('cred').select();toast('انسخ النص يدوياً')})">نسخ البيانات</button><button class="btn sec" onclick="closeM();vCapps()">تم</button></div>`);
 }catch(e){toast('تعذر الاعتماد: '+(e.message||''));$('apok')&&($('apok').disabled=false)}}
async function appReject(id){
 const reason=prompt('سبب الرفض (يظهر للإدارة فقط)','');if(reason===null)return;
 const r=await sb.from('courier_applications').update({status:'rejected',reject_reason:reason.trim()||null,reviewed_at:new Date().toISOString()}).eq('id',id);
 if(r.error)return toast('تعذر تسجيل الرفض');
 closeM();toast('تم الرفض');vCapps()}

/* ---------- إعادة تعيين كلمة مرور المندوب ---------- */

 if(!confirm('سيتم إنشاء كلمة مرور جديدة وإلغاء القديمة. متابعة؟'))return;
 const pw=appPw();
 const r=await sb.rpc('admin_reset_courier_password',{p_user:userId,p_password:pw});
 if(r.error)return toast('تعذر التغيير: '+r.error.message);
 const link=location.origin+'/courier/';
 const txt=`مرحباً ${name}، هذه بيانات الدخول الجديدة لتطبيق المندوب في جبلاوى.\nرابط التطبيق: ${link}\nرقم الجوال: ${phone}\nكلمة المرور: ${pw}`;
 modal(`<h2 style="margin-bottom:6px">تم تغيير كلمة المرور ✅</h2>
   <p class="u" style="margin-bottom:8px">أرسل البيانات الجديدة للمندوب. كلمة المرور لا تُعرض مرة أخرى.</p>
   <textarea readonly id="cred" style="width:100%;min-height:130px" dir="rtl">${esc(txt)}</textarea>
   <div class="two" style="margin-top:12px"><button class="btn" onclick="navigator.clipboard.writeText($('cred').value).then(()=>toast('تم النسخ'),()=>{$('cred').select();toast('انسخ النص يدوياً')})">نسخ البيانات</button><button class="btn sec" onclick="closeM()">تم</button></div>`)}
