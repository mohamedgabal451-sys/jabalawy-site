async function quote(code){
 const r=await sb.rpc('promo_quote',{p_code:code,p_subtotal:sub()});
 if(r.error)return {ok:false,msg:'تعذر التحقق من الكود الآن'};
 const q=r.data&&r.data[0];return q?{ok:q.ok,disc:+q.discount,msg:q.message}:{ok:false,msg:'كود الخصم غير صحيح'}}
async function applyPromo(){
 const code=(promo.input||'').trim().toUpperCase();if(!code)return toast('اكتب كود الخصم');
 $('pb').disabled=true;const q=await quote(code);
 if(q.ok)promo={code,disc:q.disc,sub:sub(),msg:q.msg,input:'',busy:false};else{promo.msg=q.msg;promo.code=''}
 if(q.ok)toast('تم تطبيق الكود: وفّرت '+fmt(q.disc));drawCart()}
async function requote(){
 promo.busy=true;const q=await quote(promo.code);
 if(q.ok){promo.disc=q.disc;promo.sub=sub();promo.msg=q.msg}else{promo={code:'',disc:0,sub:0,msg:q.msg,input:'',busy:false};toast(q.msg)}
 promo.busy=false;if(scr==='cart')drawCart()}
function clearPromo(){promo={code:'',disc:0,sub:0,msg:'',input:'',busy:false};drawCart()}
function locate(){if(!navigator.geolocation)return toast('المتصفح لا يدعم تحديد الموقع');

function drawOrders(){
 if(!ORD.length){$('ordBody').innerHTML='<div class="empty"><div style="font-size:52px">🧺</div><b>لا توجد طلبات بعد</b><p style="margin-top:6px">اطلب أول طلب لك واستلمه خلال دقائق.</p><button class="cta" style="margin-top:16px" onclick="go(\'home\')">تسوّق الآن</button></div>';return}
 const live=['placed','picking','ready','picked_up','awaiting_payment'];
 $('ordBody').innerHTML=ORD.map(o=>{
  const d=new Date(o.created_at).toLocaleString('ar-EG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}),on=live.includes(o.status);
  const items=o.order_items.map(i=>esc(i.name)+' ×'+i.qty).join('، ');
  return `<div class="ordc ${on?'live':''}" role="button" tabindex="0" onclick="openTrack(${o.id})">

function reorder(id){
 const o=ORD.find(x=>x.id===id);if(!o)return;let n=0;
 o.order_items.forEach(i=>{const m=stock[i.product_id]||0;if(P.find(x=>x.id===i.product_id)&&m>0){cart[i.product_id]=Math.min(m,i.qty);n++}});
 if(!n)return toast('منتجات هذا الطلب غير متوفرة حالياً');
 toast('أضفنا '+n+' منتج إلى السلة');go('cart')}

/* ---------- الخريطة: تحديد موقع العميل ---------- */
let M=null,mapPos=null,mapName='',mapBusy=false,geoT=null;
function loadLeaflet(){return window.L?Promise.resolve():new Promise((ok,no)=>{
 const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);
 const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=ok;s.onerror=()=>no(new Error('map'));document.head.appendChild(s)})}
async function openMap(lb){
 if(lb)mapLabel=lb;
 if(!user){toast('سجّل دخولك لتحديد موقع التوصيل');return openLogin('home')}
 $('map').classList.remove('hide');$('nav').classList.add('hide');$('bar').classList.add('hide');
 $('maddr').textContent='جاري تحميل الخريطة...';$('mdet').value='';$('mwarn').textContent='';
 try{await loadLeaflet()}catch(e){closeMap();return toast('تعذر تحميل الخريطة. تحقق من الاتصال بالإنترنت')}
 const c0=addr.lat?[addr.lat,addr.lng]:(STOREINFO?[STOREINFO.lat,STOREINFO.lng]:[30.03,31.47]);
 if(!M){
  M=L.map('mapv',{zoomControl:false}).setView(c0,16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(M);
  L.control.zoom({position:'topleft'}).addTo(M);
  M.on('moveend',onMapMove);mapSearchInit();
 }else M.setView(c0,16);
 drawStores();setTimeout(()=>{M.invalidateSize();onMapMove()},80);
 if(!addr.lat)mapLocate(true)}
function closeMap(){$('map').classList.add('hide');if(NAVS.includes(scr))$('nav').classList.remove('hide');bar()}
function mapLocate(silent){
 if(!navigator.geolocation){if(!silent)toast('المتصفح لا يدعم تحديد الموقع');return}
 navigator.geolocation.getCurrentPosition(p=>{if(M)M.setView([p.coords.latitude,p.coords.longitude],17)},
  ()=>{if(!silent)toast('تعذر تحديد موقعك. حرّك الخريطة لاختيار المكان')},{enableHighAccuracy:true,timeout:10000})}
function onMapMove(){
 if(!M)return;const c=M.getCenter();mapPos={lat:c.lat,lng:c.lng};
 const out=STORES.length&&!inRangeAny(c.lat,c.lng);
 $('mwarn').textContent=out?'هذا الموقع خارج نطاق التوصيل لجميع مستودعاتنا':'';
 $('mok').disabled=!!out;
 clearTimeout(geoT);$('maddr').textContent='جاري تحديد العنوان...';
 geoT=setTimeout(()=>revGeo(c.lat,c.lng),550)}
async function revGeo(lat,lng){
 let name='موقع محدد على الخريطة';
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=ar&lat='+lat+'&lon='+lng);
  const j=await r.json(),a=j.address||{};
  const p=[a.road,a.neighbourhood||a.suburb||a.quarter,a.city||a.town||a.state_district||a.state].filter(Boolean);
  name=p.length?p.join('، '):(j.display_name||name).split(',').slice(0,3).join('،');
 }catch(e){}
 if(!mapPos||Math.abs(mapPos.lat-lat)>1e-7||Math.abs(mapPos.lng-lng)>1e-7)return;
 mapName=name;$('maddr').textContent=name}
let mapLabel='منزل';
function addrMenuHtml(){
 const ic={'منزل':'🏠','عمل':'💼'};
 const find=l=>addrs.find(a=>labelOf(a.line)===l);
 let h='';
 ['منزل','عمل'].forEach(l=>{const a=find(l);
  h+=a?`<button class="am-row ${a.id===saved.id?'on':''}" onclick="chooseAddr('${a.id}')"><span>${ic[l]} ${l}</span><small>${esc(stripLabel(a.line))}</small></button>`
      :`<button class="am-row" onclick="closeAddrMenu();openMap('${l}')"><span>${ic[l]} ${l}</span><small>لم تضف ${l} بعد، اضغط لتحديده على الخريطة</small></button>`});
 addrs.filter(a=>!ic[labelOf(a.line)]).slice(0,8).forEach(a=>{h+=`<button class="am-row ${a.id===saved.id?'on':''}" onclick="chooseAddr('${a.id}')"><span>📍 ${esc(labelOf(a.line)||'موقع محفوظ')}</span><small>${esc(stripLabel(a.line))}</small></button>`});
 h+=`<button class="am-row am-add" onclick="closeAddrMenu();openMap('أخرى')">＋ إضافة عنوان جديد</button>`;
 return h;
}
function toggleAddrMenu(){

function closeAddrMenu(){const m=$('addrMenu');if(m)m.classList.add('hide')}
function chooseAddr(id){
 const a=addrs.find(x=>x.id===id);if(!a)return;
 setAddr(a);closeAddrMenu();if(scr==='cart')drawCart();toast('تم اختيار موقع التوصيل');

document.addEventListener('click',e=>{if(!e.target.closest('.addr-wrap'))closeAddrMenu()});
function labelOf(l){const m=/^\[(منزل|عمل|أخرى)\]\s*/.exec(l||'');return m?m[1]:''}
function stripLabel(l){return (l||'').replace(/^\[(منزل|عمل|أخرى)\]\s*/,'')}
async function mapConfirm(){
 if(!mapPos||mapBusy)return;
 const det=$('mdet').value.trim();
 if(det.length<3){$('mdet').focus();return toast('اكتب تفاصيل العنوان: رقم العمارة والدور والشقة')}
 mapBusy=true;$('mok').disabled=true;
 const line=('['+mapLabel+'] '+det+' - '+(mapName||'موقع محدد على الخريطة')).slice(0,250);
 const a=await sb.from('addresses').insert({customer_id:user.id,line,lat:mapPos.lat,lng:mapPos.lng}).select().single();
 mapBusy=false;$('mok').disabled=false;
 if(a.error)return toast('تعذر حفظ الموقع، حاول مرة أخرى');
 addrs.unshift(a.data);setAddr(a.data);closeMap();toast('تم تحديد موقع التوصيل');
 if(scr==='cart')drawCart();if(scr==='me')drawMe()}

const OSM='https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
let TM=null,TMk={};
const mkIcon=(e,c)=>L.divIcon({className:'',html:'<div class="mkr '+(c||'')+'">'+e+'</div>',iconSize:[40,40],iconAnchor:[20,20]});
async function trackMap(){
 const o=order,box=$('trMapBox');
 const show=!!(o&&o.address_lat&&['picking','ready','picked_up'].includes(o.status));
 box.classList.toggle('hide',!show);if(!show)return;
 try{await loadLeaflet()}catch(e){box.classList.add('hide');return}
 if(TM&&TM._oid!==o.id){TM.remove();TM=null;TMk={}}
 const home=[+o.address_lat,+o.address_lng];
 if(!TM){
  TM=L.map('trmap',{zoomControl:false}).setView(home,15);TM._oid=o.id;TM._touched=false;
  L.tileLayer(OSM,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(TM);
  TM.on('dragstart zoomstart',()=>{TM._touched=true});
  TMk.home=L.marker(home,{icon:mkIcon('🏠')}).addTo(TM);
  if(STOREINFO)TMk.store=L.marker([+STOREINFO.lat,+STOREINFO.lng],{icon:mkIcon('🏬')}).addTo(TM);
 }
 setTimeout(()=>TM&&TM.invalidateSize(),60);
 const has=courier&&courier.lat;
 if(has){const c=[+courier.lat,+courier.lng];
  if(!TMk.c)TMk.c=L.marker(c,{icon:mkIcon('🛵','c'),zIndexOffset:1000}).addTo(TM);else TMk.c.setLatLng(c);
  if(!TMk.line)TMk.line=L.polyline([c,home],{color:'#0B5D44',weight:4,opacity:.7,dashArray:'6 8'}).addTo(TM);else TMk.line.setLatLngs([c,home]);
 }
 const d=has?km(+courier.lat,+courier.lng,home[0],home[1]):null;
 $('trEta').textContent=d!==null?(d<0.05?'المندوب وصل تقريباً':'يصل خلال حوالي '+Math.max(1,Math.round(d/0.45))+' دقيقة'):(o.status==='picked_up'?'جاري تحديد موقع المندوب...':'المندوب في طريقه لاستلام طلبك');
 if(!TM._touched)fitTrack()}
function fitTrack(){
 if(!TM)return;const o=order,pts=[[+o.address_lat,+o.address_lng]];
 if(courier&&courier.lat)pts.push([+courier.lat,+courier.lng]);else if(STOREINFO)pts.push([+STOREINFO.lat,+STOREINFO.lng]);
 TM.fitBounds(pts,{padding:[56,56],maxZoom:17,animate:false})}
function recenterTrack(){if(TM){TM._touched=false;fitTrack()}}

/* ---------- الدردشة بين العميل والمندوب ---------- */
let CH={oid:null,msgs:[],open:false,unread:0,chan:null,name:'',closed:false};
const myId=()=>user.id;
const QUICK=['أنا في انتظارك','اترك الطلب عند الباب','سأنزل لاستلام الطلب'];
function chatBadge(){document.querySelectorAll('.chat-dot').forEach(d=>{d.textContent=CH.unread;d.classList.toggle('hide',!CH.unread)})}
async function chatInit(oid){
 if(CH.oid===oid)return;chatStop();CH.oid=oid;
 const r=await sb.from('order_messages').select('*').eq('order_id',oid).order('id');
 if(CH.oid!==oid)return;
 CH.msgs=r.data||[];CH.unread=CH.msgs.filter(m=>m.sender_id!==myId()&&!m.read_at).length;
 CH.chan=sb.channel('chat'+oid).on('postgres_changes',{event:'INSERT',schema:'public',table:'order_messages',filter:'order_id=eq.'+oid},p=>{
  if(CH.msgs.some(m=>m.id===p.new.id))return;CH.msgs.push(p.new);
  if(p.new.sender_id!==myId()){
   if(CH.open)markRead();
   else{CH.unread++;toast('💬 رسالة جديدة'+(CH.name?' من '+CH.name:''));try{if(typeof beep==='function')beep()}catch(e){}}}
  if(CH.open)drawChat();chatBadge()}).subscribe();
 const n=await sb.rpc('order_party_name',{p_order:oid});if(CH.oid===oid)CH.name=n.data||'';
 chatBadge();if(order&&scr==='track')(order&&scr==='track')&&render0()}
function chatStop(){if(CH.chan)sb.removeChannel(CH.chan);CH={oid:null,msgs:[],open:false,unread:0,chan:null,name:'',closed:false};chatBadge();const c=$('chat');if(c)c.classList.add('hide')}
function openChat(){
 if(!CH.oid)return;CH.open=true;$('chat').classList.remove('hide');
 $('chN').textContent=CH.name||'المندوب';
 $('chQ').innerHTML=QUICK.map(q=>`<button type="button" onclick="sendMsg(null,this.textContent)">${esc(q)}</button>`).join('');
 drawChat();markRead()}
function closeChat(){CH.open=false;$('chat').classList.add('hide')}
async function markRead(){CH.unread=0;chatBadge();await sb.rpc('mark_messages_read',{p_order:CH.oid})}
function drawChat(){
 const L=$('chL'),me=myId();
 L.innerHTML=CH.msgs.length?CH.msgs.map(m=>`<div class="msg ${m.sender_id===me?'me':'th'}"><span>${esc(m.body)}</span><small>${new Date(m.created_at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}</small></div>`).join(''):'<div class="empty">ابدأ المحادثة بإرسال رسالة.</div>';
 L.scrollTop=L.scrollHeight}
async function sendMsg(e,text){
 if(e)e.preventDefault();const i=$('chI'),t=(text||i.value).trim();if(!t||!CH.oid)return;
 $('chB').disabled=true;if(!text)i.value='';
 const r=await sb.rpc('send_message',{p_order:CH.oid,p_body:t});$('chB').disabled=false;
 if(r.error){if(!text)i.value=t;return toast(r.error.message)}
 setTimeout(async()=>{if(CH.msgs.some(m=>m.id===r.data))return;
  const x=await sb.from('order_messages').select('*').eq('id',r.data).single();
  if(x.data&&!CH.msgs.some(m=>m.id===x.data.id)){CH.msgs.push(x.data);if(CH.open)drawChat()}},1500)}

 const cur=CATLIST.find(x=>x.id===CATV.id);
 if(!cur){
  $('catT').textContent='التصنيفات';
  el.innerHTML=`<div class="ctiles">${CATLIST.filter(x=>!x.parent_id).map(c=>tileBtn(c)).join('')}</div>`;return}
 const kids=CATLIST.filter(x=>x.parent_id===cur.id);
 $('catT').textContent=cur.name;
 const back=`<button class="cback" onclick="catBack()">→ ${cur.parent_id?'القسم الرئيسي':'كل التصنيفات'}</button>`;
 if(CATV.all){
  const ids=[cur.id,...kids.map(k=>k.id)];
  const L=P.filter(x=>ids.includes(x.category_id));
  el.innerHTML=back+(L.length?`<div class="grid">${L.map(catCard).join('')}</div>`:'<div class="empty">لا توجد منتجات في هذا القسم بعد</div>');return}
 if(kids.length){
  el.innerHTML=back+`<div class="ctiles">${tileBtn({id:cur.id,name:'الكل',emoji:'✨'},true)}${kids.map(c=>tileBtn(c)).join('')}</div>`;return}
 const L=P.filter(x=>x.category_id===cur.id);
 el.innerHTML=back+(L.length?`<div class="grid">${L.map(catCard).join('')}</div>`:'<div class="empty">لا توجد منتجات في هذا القسم بعد</div>');
}
function catOpen(id){CATV={id,all:false};renderCatsec()}
function catAll(id){CATV={id,all:true};renderCatsec()}
function catBack(){
 const cur=CATLIST.find(x=>x.id===CATV.id);
 if(CATV.all){CATV={id:CATV.id,all:false}}
 else if(cur&&cur.parent_id){CATV={id:cur.parent_id,all:false}}
 else CATV={id:null,all:false};
 renderCatsec()}

/* ---------- الواجهة الرئيسية (بلوكات الإدارة) ---------- */
let HT=[];
const tileTxt=t=>`<b>${esc(t.title)}</b>${t.subtitle?`<small>${esc(t.subtitle)}</small>`:''}`;
const tileBg=t=>t.image_url?`background:${esc(t.bg)} url('${esc(t.image_url)}') center/cover no-repeat`:`background:${esc(t.bg)}`;
function tileGo(id){const t=HT.find(x=>x.id===id);if(!t)return;
 if(t.link_type==='offers')return go('offers');
 if(t.link_type==='category'){if(t.link_id)catOpen(t.link_id);return go('catsec')}}
function homeBlocks(){
 const H=HT.filter(t=>t.kind==='hero'),R=HT.filter(t=>t.kind==='promo'),B=HT.filter(t=>t.kind==='banner');
 const mainCats=CATLIST.filter(c=>!c.parent_id);
 let h='';
 if(H.length)h+=`<div class="hm-hero">${H.map(t=>`<button class="hm-slide" style="${tileBg(t)}" onclick="tileGo(${t.id})">${tileTxt(t)}</button>`).join('')}</div>`;
 if(mainCats.length)h+=`<div class="hm-cats">${mainCats.slice(0,8).map(c=>`<button class="hm-cat" onclick="catOpen(${c.id});go('catsec')"><span class="hm-ci">${tileImg(c)}</span><span>${esc(c.name)}</span></button>`).join('')}</div>`;
 h+=`<div class="hm-free">🛵 توصيل مجاني للطلبات من 300 ج.م</div>`;
 if(R.length)h+=`<div class="hm-sh">عروض اليوم</div><div class="hm-row">${R.map(t=>`<button class="hm-promo" style="${tileBg(t)}" onclick="tileGo(${t.id})">${tileTxt(t)}</button>`).join('')}</div>`;
 B.forEach(t=>{h+=`<button class="hm-banner" style="${tileBg(t)}" onclick="tileGo(${t.id})">${tileTxt(t)}</button>`});
 return h;
}

const supportHtml=()=>SUPPORT_WA?`<a class="cta sec" href="https://wa.me/${SUPPORT_WA}?text=${encodeURIComponent('مرحباً، أحتاج مساعدة في طلبي')}" target="_blank" rel="noopener">🛟 تواصل مع الدعم الفني</a>`:'';

/* ---------- تقييم المندوب من العميل ---------- */
let RT={},RSC={};
async function loadRT(o){RT[o.id]='loading';
 const r=await sb.from('order_ratings').select('stars,comment').eq('order_id',o.id).eq('direction','customer_to_courier').maybeSingle();
 RT[o.id]=r.data||false;if(order&&order.id===o.id)render0()}
const rateHtml=o=>{if(o.status!=='delivered'||!o.courier_id)return '';
 const rt=RT[o.id];if(rt===undefined||rt==='loading')return '';
 if(rt)return `<div class="rtb"><b>قيّمت المندوب</b><span class="stv">${'★'.repeat(rt.stars)}${'☆'.repeat(5-rt.stars)}</span></div>`;
 const n=RSC[o.id]||0;
 return `<div class="rtb"><b>كيف كان توصيل المندوب؟</b><div class="stars">${[1,2,3,4,5].map(k=>`<button class="st${k<=n?' on':''}" onclick="RSC[${o.id}]=${k};render0()" aria-label="${k} نجوم">★</button>`).join('')}</div>
 <textarea id="rtc" maxlength="300" placeholder="تعليق (اختياري)"></textarea><button class="cta" onclick="sendCRate(${o.id})">إرسال التقييم</button></div>`};
async function sendCRate(oid){const n=RSC[oid];if(!n)return toast('اختر عدد النجوم');
 const c=document.getElementById('rtc');
 const r=await sb.rpc('rate_order',{p_order:oid,p_stars:n,p_comment:c?c.value:null});
 if(r.error)return toast(r.error.message.includes('تم تقييم')?'تم تقييم هذا الطلب من قبل':'تعذر إرسال التقييم');
 toast('شكراً لتقييمك');loadRT({id:oid})}

/* ---------- البحث على الخريطة ---------- */
let msT=null;
function mapSearchInit(){
 const inp=document.getElementById('msq');if(!inp||inp.dataset.ok)return;inp.dataset.ok='1';
 inp.addEventListener('input',()=>{clearTimeout(msT);msT=setTimeout(()=>mapSearch(inp.value),450)});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();mapSearch(inp.value,true)}});
}
async function mapSearch(q,pickFirst){
 q=(q||'').trim();const box=document.getElementById('msres');
 if(q.length<3){box.classList.add('hide');box.innerHTML='';return}
 box.classList.remove('hide');box.innerHTML='<div class="msr u">جاري البحث...</div>';
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=eg&accept-language=ar&q='+encodeURIComponent(q));
  const L=await r.json();
  if(!L.length){box.innerHTML='<div class="msr u">لا توجد نتائج. جرّب اسماً آخر أو أضف المنطقة (مثال: الشيخ زايد)</div>';return}
  if(pickFirst){mapGoTo(+L[0].lat,+L[0].lon);box.classList.add('hide');box.innerHTML='';return}
  box.innerHTML=L.map((x,i)=>`<button class="msr" data-i="${i}">📍 ${esc(x.display_name.split(',').slice(0,3).join('، '))}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const x=L[+b.dataset.i];mapGoTo(+x.lat,+x.lon);box.classList.add('hide');box.innerHTML='';document.getElementById('msq').value=''});
 }catch(e){box.innerHTML='<div class="msr u">تعذر البحث. تحقق من الإنترنت.</div>'}
}
function mapGoTo(lat,lng){if(M)M.setView([lat,lng],17)}
